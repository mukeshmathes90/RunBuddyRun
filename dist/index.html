<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Run Buddy Run</title>

  <!-- MediaPipe scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    /* === General Body and HTML Styles === */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* Keeps game full screen without scrollbars */
      background: #121212; /* Dark charcoal background for the page */
      font-family: 'Arial', sans-serif; /* A clean default fallback font */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0; /* Light gray text for general readability if needed outside canvas */
    }

    /* === Control Choice Modal === */
    #controlChoiceModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(25, 30, 35, 0.97); /* Dark, slightly more opaque modal background */
      /* display: flex; is set by JS when shown */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      color: #e0e0e0;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      /* For fading - initial state handled by JS or direct style manipulation */
      /* opacity: 0; visibility: hidden; */
      /* transition: opacity 0.5s ease-in-out, visibility 0s linear 0.5s; */
    }

    /* This class can be added by JS to hide the modal if you prefer class-based hiding */
    /* #controlChoiceModal.hidden {
      display: none !important; 
    } */

    /* Title inside the modal */
    #controlChoiceModal h2 {
      font-family: 'Akaya Telivigala', sans-serif; /* Your game's font */
      font-size: 2.8em; /* Larger title */
      color: #61dafb; /* A bright accent color (light blue) */
      margin-top: 0;
      margin-bottom: 40px; /* More space below title */
      text-shadow: 0 0 10px rgba(97, 218, 251, 0.6); /* Subtle glow effect */
    }

    /* Buttons inside the modal */
    #controlChoiceModal button {
      font-family: 'Akaya Telivigala', sans-serif; /* Your game's font */
      font-size: 1.4em; /* Larger button text */
      color: #ffffff;
      background-color: #404752; /* A solid, modern button color */
      border: none;
      border-radius: 10px; /* Softer rounded corners */
      padding: 18px 35px; /* More padding */
      margin: 15px; /* Space around buttons */
      min-width: 280px; /* Good minimum width */
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35); /* Button shadow */
      letter-spacing: 0.5px;
    }

    #controlChoiceModal button:hover {
      background-color: #525a66; /* Lighter on hover */
      transform: translateY(-3px) scale(1.02); /* Lift and slight zoom effect */
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.4);
    }

    #controlChoiceModal button:active {
      background-color: #303742; /* Darker when pressed */
      transform: translateY(0px) scale(1);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    /* Specific style for Camera button to denote experimental nature */
    #cameraBtn {
      background-color: #c0392b; /* A distinct color, e.g., a muted red */
    }

    #cameraBtn:hover {
      background-color: #d35400; /* Brighter red/orange on hover */
    }


    /* === Webcam Feed & Toggle Button === */
    #webcamFeed {
      /* display: none; is set by JS when needed */
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 150px;
      border: 3px solid #61dafb; /* Accent border color */
      border-radius: 8px;
      z-index: 1001; /* Above game, below modal */
      transform: scaleX(-1); /* Mirror for intuitive view */
      background-color: #1c1c1c;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    #toggleWebcamViewBtn {
      /* display: none; is set by JS when needed */
      position: fixed;
      bottom: 180px; /* Positioned above the default webcam feed location */
      right: 20px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1002; /* Above webcam feed */
      font-family: 'Akaya Telivigala', sans-serif;
      font-size: 0.9em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background-color 0.2s ease;
    }

    #toggleWebcamViewBtn:hover {
      background-color: #0056b3;
    }

    /* === Game Container === */
    #game {
      width: 100%;
      height: 100%;
      /* display: none; is set by JS when game starts */
    }

    /* Canvas styling */
    canvas {
      display: block; /* Important for Phaser to manage layout */
      /* Phaser's scale manager will handle the sizing and centering inside #game div */
    }
  </style>
</head>
<body>

  <!-- Modal for control choice -->
  <!-- Your src/index.js will handle setting 'display: flex' or 'display: none' -->
  <div id="controlChoiceModal" style="display: none;"> 
    <h2>Select Control Method</h2>
    <button id="keyboardBtn">Keyboard</button>
    <button id="cameraBtn">Camera (Experimental)</button>
  </div>

  <!-- Webcam video feed (initially hidden by JS) -->
  <video id="webcamFeed" autoplay playsinline muted style="display: none;"></video>

  <!-- Toggle Webcam Button (initially hidden by JS) -->
  <button id="toggleWebcamViewBtn" style="display: none;">Toggle Webcam View</button>
  
  <!-- Game container (Phaser will render here; initially hidden by JS) -->
  <div id="game" style="display: none;"></div>

  <!-- Your main bundled JavaScript file -->
  <script src="main.js"></script>

  <!-- The inline script that was here previously for modal logic has been REMOVED -->
  <!-- because this logic is handled by your src/index.js (bundled into main.js) -->

</body>
</html>
